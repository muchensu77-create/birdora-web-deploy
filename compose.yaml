services:
  birdora-web:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_FILE: /data/birdora.sqlite
      PORT: 4000
    ports:
      - "4000:4000"
    restart: unless-stopped
    volumes:
      - birdora_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  birdora_data:
