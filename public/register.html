<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>注册 - Birdora</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="./assets/favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./design-system.css" />
  </head>
  <body data-page="register">
    <main class="auth-page auth-page-simple">
      <section class="auth-shell auth-shell-simple">
        <div class="auth-intro auth-intro-simple">
          <p class="eyebrow">Birdora</p>
          <h1>创建账号</h1>
          <p>注册后可以保存识别记录、发布观鸟笔记，并在设备页同步 Birdora Glasses。</p>
        </div>

        <form class="auth-card auth-card-main auth-card-switcher" data-auth-form="account" data-auth-mode="register" novalidate>
          <div class="auth-card-head auth-card-head-compact">
            <p class="eyebrow" id="authModeEyebrow">注册</p>
            <h2 id="authModeTitle">创建你的 Birdora 账号</h2>
            <p class="auth-subcopy" id="authModeCopy">注册后可以保存识别记录、发布观鸟笔记，并在设备页同步眼镜数据。</p>
          </div>

          <div class="auth-fields">
            <label class="auth-field auth-field-optional" data-auth-visible="register">
              <span>昵称</span>
              <input type="text" name="nickname" placeholder="为你的账号起一个名字" autocomplete="nickname" />
            </label>

            <label class="auth-field">
              <span>邮箱</span>
              <input type="email" name="email" placeholder="name@example.com" autocomplete="email" />
            </label>

            <label class="auth-field">
              <span>密码</span>
              <input type="password" name="password" placeholder="至少 8 位密码" autocomplete="new-password" />
            </label>
          </div>

          <label class="agree-row" data-auth-visible="register">
            <input type="checkbox" name="agree" />
            <span>
              注册即表示你同意
              <a href="./terms.html" target="_blank" rel="noreferrer">《用户协议》</a>
              和
              <a href="./privacy.html" target="_blank" rel="noreferrer">《隐私政策》</a>
            </span>
          </label>

          <button class="primary-btn auth-submit auth-submit-pill" id="authSubmitBtn" type="submit">注册并进入</button>
          <p class="auth-message" data-auth-message aria-live="polite" role="alert"></p>

          <p class="auth-switch-copy">
            <span>已经有账号？</span>
            <a class="auth-switch-btn" href="./login.html">去登录</a>
          </p>
        </form>

        <div class="auth-legal">
          <a href="./terms.html" target="_blank" rel="noreferrer">用户协议</a>
          <span>·</span>
          <a href="./privacy.html" target="_blank" rel="noreferrer">隐私政策</a>
        </div>
      </section>
    </main>

    <script src="./community-api.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
