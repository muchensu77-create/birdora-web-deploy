<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 / 注册 - Birdora</title>
    <link rel="stylesheet" href="./styles.css?v=20260625-headspace-refresh" />
  </head>
  <body data-page="login">
    <main class="auth-page auth-page-simple">
      <section class="auth-shell auth-shell-simple">
        <div class="auth-intro auth-intro-simple">
          <p class="eyebrow">Birdora</p>
          <h1>欢迎回来</h1>
          <p>登录后继续识鸟、记录观察，并查看你的社区分享。</p>
        </div>

        <form class="auth-card auth-card-main" data-auth-form="login" novalidate>
          <div class="auth-card-head">
            <p class="eyebrow">登录</p>
            <h2>继续你的观鸟记录</h2>
          </div>

          <label>
            <span>邮箱</span>
            <input type="email" name="email" placeholder="name@example.com" />
          </label>

          <label>
            <span>密码</span>
            <input type="password" name="password" placeholder="请输入密码" />
          </label>

          <button class="primary-btn auth-submit auth-submit-pill" id="loginBtn" type="button">登录</button>
          <p class="auth-message" data-auth-message></p>
        </form>

        <form class="auth-card auth-card-subtle" data-auth-form="register">
          <div class="auth-register-copy">
            <p class="eyebrow">注册</p>
            <h2>还没有账号？</h2>
            <p>创建一个本地演示账号，继续保存你的观鸟笔记和评论。</p>
          </div>

          <div class="auth-inline-fields">
            <input type="text" name="nickname" placeholder="昵称" required />
            <input type="email" name="email" placeholder="邮箱地址" required />
            <input type="password" name="password" placeholder="设置密码" required />
          </div>

          <label class="agree-row">
            <input type="checkbox" name="agree" />
            <span>
              注册即表示你同意
              <a href="./terms.html" target="_blank" rel="noreferrer">《用户协议》</a>
              与
              <a href="./privacy.html" target="_blank" rel="noreferrer">《隐私政策》</a>
            </span>
          </label>

          <button class="secondary-btn auth-submit auth-submit-pill" type="submit">注册并进入</button>
          <p class="auth-message" data-auth-message></p>
        </form>

        <div class="auth-legal">
          <a href="./terms.html" target="_blank" rel="noreferrer">用户协议</a>
          <span>·</span>
          <a href="./privacy.html" target="_blank" rel="noreferrer">隐私政策</a>
        </div>
      </section>
    </main>

    <script src="./script.js?v=20260624-auth-community"></script>
  </body>
</html>
