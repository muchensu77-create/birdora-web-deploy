map $uri $birdora_cache_control {
  default "";
  / "no-cache, must-revalidate";
  ~*^/api/ "no-store";
  ~*\.json$ "no-cache, must-revalidate";
  ~*\.mjs$ "no-store, max-age=0";
  ~*\.(html|css|js)$ "no-cache, must-revalidate";
  ~*^/assets/.*\.(png|jpg|jpeg|webp|avif|svg|wasm|onnx)$ "no-cache, must-revalidate";
}

server {
  listen 80;
  server_name birdora.birdai-glasses.com;
  client_max_body_size 2m;

  root /var/www/birdora-web/.active-public;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cache-Control $birdora_cache_control always;

  error_page 503 = @birdora_api_maintenance;

  location ~ ^/(app|docs|scripts|node_modules|\.git)(/|$) {
    return 404;
  }

  location ~ (^|/)\. {
    return 404;
  }

  location ~ ^/(server\.js|package\.json|pnpm-lock\.yaml|ecosystem\.config\.cjs|README\.md|\.env) {
    return 404;
  }

  location ~* \.(sqlite|db|bak|backup|env|pem|key|log|sql|dump|zip|tar|tgz|gz)$ {
    return 404;
  }

  # Match the HTTPS proxy envelope for an 8 MiB Base64-encoded video.
  location ~ ^/api/community/posts/?$ {
    if (-f /var/lib/birdora-maintenance/maintenance.flag) { return 503; }
    client_max_body_size 16m;
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    if (-f /var/lib/birdora-maintenance/maintenance.flag) { return 503; }
    proxy_pass http://127.0.0.1:3003/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location @birdora_api_maintenance {
    default_type application/json;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store" always;
    return 503 '{"message":"Birdora is updating safely; please retry shortly","code":"MAINTENANCE"}';
  }

  location ~* \.json$ {
    if (-f /var/lib/birdora-maintenance/maintenance.flag) { return 503; }
    try_files $uri =404;
  }

  location ~* \.mjs$ {
    if (-f /var/lib/birdora-maintenance/maintenance.flag) { return 503; }
    default_type application/javascript;
    etag off;
    if_modified_since off;
    try_files $uri =404;
  }

  location ~* \.(html|css|js)$ {
    if (-f /var/lib/birdora-maintenance/maintenance.flag) { return 503; }
    try_files $uri =404;
  }

  location ~* ^/assets/.*\.(png|jpg|jpeg|webp|avif|svg|wasm|onnx)$ {
    if (-f /var/lib/birdora-maintenance/maintenance.flag) { return 503; }
    try_files $uri =404;
  }

  location = / {
    if (-f /var/lib/birdora-maintenance/maintenance.flag) { return 503; }
    try_files /index.html =404;
  }

  location / {
    if (-f /var/lib/birdora-maintenance/maintenance.flag) { return 503; }
    try_files $uri $uri/ =404;
  }
}
